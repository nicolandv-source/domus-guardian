name: DOMUS Guardian
version: "1.0.1"
slug: domus_guardian
description: Motore health, incidenti e notifiche per Home Assistant

arch:
  - amd64

startup: application
boot: auto
init: false

homeassistant_api: true
hassio_api: false

ports:
  8000/tcp: 8000

ports_description:
  8000/tcp: API REST DOMUS Guardian

webui: "http://[HOST]:[PORT:8000]/docs"

environment:
  APP_VERSION: "1.0.1"
  HA_URL: "http://supervisor/core"
  HA_WS_URL: "ws://supervisor/core/websocket"
  HA_REQUEST_TIMEOUT_SECONDS: "10"
  HA_VERIFY_SSL: "false"

options:
  database_host: "db21ed7f-postgres-latest"
  database_port: 5432
  database_name: "domus_guardian"
  database_user: "domus_guardian"
  database_password: null
  device_debounce_seconds: 45
  notify_important_incidents: true
  notification_cooldown_minutes: 10
  watchdog_interval_seconds: 60
  watchdog_websocket_stale_minutes: 10
  watchdog_memory_threshold_mb: 512

schema:
  database_host: str
  database_port: port
  database_name: str
  database_user: str
  database_password: password
  device_debounce_seconds: int
  notify_important_incidents: bool
  notification_cooldown_minutes: int
  watchdog_interval_seconds: int
  watchdog_websocket_stale_minutes: int
  watchdog_memory_threshold_mb: int
